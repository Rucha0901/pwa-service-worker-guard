spec_version: "0.1.0"
name: pwa-service-worker-guard
version: 1.0.0
description: Progressive web app offline caching, service worker cache invalidation, and background sync management.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - stale-while-revalidate-tuning
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - developer-tools
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/Rucha0901/pwa-service-worker-guard"
